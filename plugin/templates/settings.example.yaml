# job-hunt settings (example)
#
# The plugin stores these in the tracker with save_config(section, data); /job-tracker:setup fills them
# in with you. This file documents the shape. Every value below is a neutral placeholder: replace it,
# or leave it null/empty to be asked during setup.

filters:                         # HARD filters: a miss drops the role
  work_mode: [remote]            # any of: remote | hybrid | onsite
  hybrid:
    max_days_per_week: null      # e.g. 2; only used if work_mode includes hybrid
    cities: []                   # e.g. ["<City>"]
  residence_country: XX          # ISO 3166-1 alpha-2 code of where you live, e.g. DE
  timezone: Etc/UTC              # IANA timezone, e.g. Europe/Berlin
  overlap_window: "UTC-0..UTC+0" # timezones you can overlap with, or explicit hours "09:00-17:00 UTC"
  work_authorisation: []         # regions/countries where you need no sponsorship, e.g. [EU] or [US]
  pay_floor:
    amount: null                 # your minimum, e.g. 80000
    currency: XXX                # ISO 4217, e.g. EUR, USD, GBP
    period: year                 # year | month | day | hour
    basis: gross                 # gross | net
  pay_rule_with_equity: "floor unchanged; equity may justify 'negotiable' answer inside band"
  band_rule: "drop only if the band MAXIMUM is below floor; straddling bands are kept"
  excluded_industries: []        # e.g. [gambling, crypto, defense, tobacco]
  excluded_role_shapes: []       # e.g. [people_manager]; engineers also [backend_only, frontend_only, forward_deployed]
  culture_red_lines: []          # e.g. [stated_overtime_expectation, overtime_screening_question]

prefs:                           # SOFT preferences: affect the score only
  titles: []                     # e.g. ["product engineer", "staff nurse", "brand designer"]
  seniority: []                  # e.g. [senior, staff, lead]
  stage: []                      # e.g. [seed, series_a, series_b, growth, public]
  stack_want: []                 # tools and skills you want, any field, e.g. [TypeScript, PostgreSQL] or [Epic, wound care] or [Figma, design systems]
  stack_avoid: []                # tools and skills you avoid, e.g. [Java] or [night shifts] or [print layout]
  domains_like: []               # e.g. [devtools, B2B SaaS, health, education]
  contract_ok: false             # open to contract / B2B work?
  availability: null             # e.g. "from <Month Year>" or "4 weeks notice"

writing:
  voice_profile: null            # set by setup if you share writing samples (stored as the "voice" document)
  humanizer: true                # run a humanizer pass on all outbound prose
  max_words_cover_note: 200
  never_volunteer_gaps: true     # gaps go in internal notes, never to employers
  signature_style: name_only     # no bare URLs in email signatures (Gmail rewrites them)

accounts:
  job_inbox_email: null          # your own inbox that recruiters write to, e.g. you@example.com | personal | work
  invite_calendar: null          # which calendar interview invites land on (check this one!)
  connected_calendar: null       # which calendar account is connected to Claude; setup warns if it differs
  chrome_autofill_risk: null     # e.g. "browser autofills a work email; always read back"

autonomy:                        # auto_apply is the only setting that allows unattended submit
  auto_apply: false              # true only after the user explicitly chooses automatic applications
  unattended: [search, verify, score, draft_note, draft_email, record]
  needs_user: [submit, send, delete, consent, personal_data, account_login]

schedule:
  daily: {days: weekdays, time: "07:00", tz: Etc/UTC}   # local scheduled task running /job-tracker:sweep
  desktop_usually_on: null       # e.g. "09:00-17:00"; the daily task is scheduled inside this window
  report_delivery: artifact      # artifact | file | email_draft (a draft to yourself, never sent)

sources:                         # chosen in setup from the source-roles catalogue
  enabled: []                    # source IDs, e.g. [linkedin, ats_boards, hn, waas, wellfound, wwr, indeed, builtin]
                                 # IDs: linkedin ats_boards hn waas wellfound wttj wwr indeed glassdoor ziprecruiter
                                 #      dice builtin usajobs jack-and-jill jobcopilot
  need_login: []                 # sources that need you logged in in the browser
  disabled: [justjoin, nofluffjobs, remoteok, remotive, monster, careerbuilder, simplyhired]
  boards: []                     # employer job boards for ats_boards, e.g. [https://jobs.ashbyhq.com/<company>]

capabilities:                    # written by start_run detection, not by you
  connectors: {}
  browser: null                  # claude-in-chrome | built-in | null
  local_folder: null

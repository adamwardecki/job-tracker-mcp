name: factory-plan
run-name: 'factory-plan #${{ inputs.issue }}'

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

jobs:
  stage:
    uses: ./.github/workflows/factory-stage.yml
    secrets: inherit
    with:
      stage: plan
      issue: ${{ inputs.issue }}
      model: claude-opus-5-5
      max_turns: '60'
      timeout: 20
      contents: read
      issues: write
      pull_requests: ''
      allowed_tools: 'Read,Grep,Glob,Write,Skill,Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(npm run setup),Bash(node --no-warnings --test:*)'

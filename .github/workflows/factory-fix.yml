name: factory-fix
run-name: 'factory-fix #${{ inputs.issue }}'

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

jobs:
  stage:
    uses: ./.github/workflows/factory-stage.yml
    secrets: inherit
    with:
      stage: fix
      issue: ${{ inputs.issue }}
      model: claude-sonnet-5-5
      max_turns: '100'
      timeout: 30
      contents: write
      issues: ''
      pull_requests: write
      allowed_tools: 'Read,Grep,Glob,Edit,Write,Skill,Agent,Bash(git:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(npm run setup),Bash(npm test),Bash(npm run test:node),Bash(npm run typecheck),Bash(npm run lint),Bash(npm run lint:fix),Bash(npm --prefix dev exec --no -- biome ci .),Bash(node --no-warnings --test:*),Bash(claude plugin validate:*)'
